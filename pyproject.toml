[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam3"
dynamic = ["version"]
description = "SAM3 (Segment Anything Model 3) -- Windows/CPU compatible fork"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Meta AI Research"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0.17",
    "numpy>=1.26,<2",
    "tqdm",
    "ftfy>=6.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "pillow",
    "einops",
]

[project.optional-dependencies]
# GPU acceleration -- installers pick one based on their platform.
#   pip install sam3[triton]   # Linux + CUDA (fastest EDT / NMS kernels)
#   pip install sam3[cupy]     # Linux or Windows + CUDA (zero-copy GPU scipy)
triton = ["triton"]
cupy = ["cupy-cuda12x"]        # adjust to cupy-cuda11x if needed

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
notebooks = [
    "matplotlib",
    "jupyter",
    "notebook",
    "ipywidgets",
    "ipycanvas",
    "ipympl",
    "pycocotools",
    "decord",
    "scikit-image",
    "scikit-learn",
]
train = [
    "hydra-core",
    "submitit",
    "tensorboard",
    "zstandard",
    "torchmetrics",
    "fvcore",
    "fairscale",
    "scikit-image",
    "scikit-learn",
]
eval = [
    "pandas",
    "opencv-python",
    "pycocotools",
    "numba",
    "python-rapidjson",
    "yt-dlp",
    "gitpython",
]

[project.scripts]
sam3 = "sam3.cli:main"

[project.urls]
Homepage = "https://github.com/facebookresearch/sam3"
"Bug Tracker" = "https://github.com/facebookresearch/sam3/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "sam3/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sam3"]

[tool.hatch.build.targets.wheel.shared-data]
"sam3/assets" = "sam3/assets"

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "E741",   # ambiguous variable name (common in math-heavy code)
    "B905",   # zip without strict= (too noisy for existing code)
    "SIM108", # ternary operator (readability preference)
    "UP007",  # Optional[T] -> T | None (not worth churn)
    "UP015",  # redundant open mode (not worth churn)
]

[tool.ruff.lint.isort]
known-first-party = ["sam3"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
